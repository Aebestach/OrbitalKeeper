        #LOC_OrbKeep_ParamUiScalePercent = Scala UI (%)
        #LOC_OrbKeep_ParamUiScalePercent_tip = Moltiplicatore aggiuntivo per le finestre Orbital Keeper rispetto alla scala UI di KSP. 100 corrisponde a KSP; 50 è la metà; 150 è 1,5x. Read-only while auto mode is enabled. Non cambia con i preset di difficoltà.
        #LOC_OrbKeep_ParamEnableToolbarButton = Abilita pulsante barra strumenti
